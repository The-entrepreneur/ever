# ─────────────────────────────────────────────────────────────
# Docker Compose — EVER Guest OS
# Runs: n8n + bot-engine + pms-api + Redis per hotel tenant
# Data Layer: Supabase (Agency Cloud) as single source of truth
# Usage: docker compose -f base/docker/docker-compose.yml up --build
# ─────────────────────────────────────────────────────────────

version: '3.8'

services:

  n8n:
    image: n8nio/n8n:latest
    container_name: n8n_${HOTEL_SLUG}
    restart: unless-stopped
    ports:
      - '${N8N_PORT}:5678'
    env_file: ../.env
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD}
      - N8N_HOST=${HOTEL_SLUG}.getever.com.ng
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - WEBHOOK_URL=${WEBHOOK_BASE_URL}
      - GENERIC_TIMEZONE=Europe/London
      - N8N_LOG_LEVEL=info
      - EXECUTIONS_DATA_SAVE_ON_SUCCESS=none
      - EXECUTIONS_DATA_SAVE_ON_ERROR=all
    volumes:
      - n8n_data_${HOTEL_SLUG}:/home/node/.n8n
      - ./credentials:/home/node/credentials:ro
    depends_on:
      redis:
        condition: service_healthy
      bot-engine:
        condition: service_started
    networks:
      - hotel_net_${HOTEL_SLUG}

  bot-engine:
    build:
      context: ../bot-engine
      dockerfile: Dockerfile
    image: hotel-bot-engine:latest
    container_name: bot_${HOTEL_SLUG}
    restart: unless-stopped
    ports:
      - '${BOT_ENGINE_PORT}:3001'
    env_file: ../.env
    environment:
      - HOTEL_SLUG=${HOTEL_SLUG}
      - BOT_ENGINE_PORT=3001
      - REDIS_URL=redis://redis_${HOTEL_SLUG}:6379
      - PMS_API_BASE_URL=http://pms_${HOTEL_SLUG}:8000
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
    volumes:
      - ./credentials:/app/credentials:ro
    depends_on:
      redis:
        condition: service_healthy
      pms-api:
        condition: service_healthy
    networks:
      - hotel_net_${HOTEL_SLUG}

  pms-api:
    build:
      context: ../pms-api
      dockerfile: Dockerfile
    image: hotel-pms-api:latest
    container_name: pms_${HOTEL_SLUG}
    restart: unless-stopped
    ports:
      - '${PMS_PORT:-8000}:8000'
    env_file: ../.env
    environment:
      - PMS_DATABASE_URL=${PMS_DATABASE_URL}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - PAYMENT_PROVIDER=${PAYMENT_PROVIDER}
      - PAYSTACK_SECRET_KEY=${PAYSTACK_SECRET_KEY}
      - FLUTTERWAVE_SECRET_KEY=${FLUTTERWAVE_SECRET_KEY}
      - FLUTTERWAVE_SECRET_HASH=${FLUTTERWAVE_SECRET_HASH}
      - HOTEL_NAME=${HOTEL_NAME}
      - WEBHOOK_BASE_URL=${WEBHOOK_BASE_URL}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - hotel_net_${HOTEL_SLUG}

  redis:
    image: redis:7-alpine
    container_name: redis_${HOTEL_SLUG}
    restart: unless-stopped
    command: >
      redis-server
      --save 60 1
      --loglevel warning
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data_${HOTEL_SLUG}:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hotel_net_${HOTEL_SLUG}

volumes:
  n8n_data_${HOTEL_SLUG}:
  redis_data_${HOTEL_SLUG}:

networks:
  hotel_net_${HOTEL_SLUG}:
    driver: bridge
